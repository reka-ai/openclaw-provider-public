name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["24", "26.8.1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      # Lifecycle scripts stay off; the suites only need the pinned host's JavaScript.
      - name: Install the pinned OpenClaw host
        run: npm run setup
      - name: Plugin unit and transport tests
        run: npm test --prefix plugin
      - name: Pinned-host suites (loopback only, dummy keys)
        run: npm test --prefix runtime
